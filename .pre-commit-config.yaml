repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: ['--fix', '--exit-non-zero-on-fix']

  - repo: local
    hooks:
      - id: coverage-check
        name: Coverage Check
        entry: bash -c 'THRESHOLD=${COVERAGE_THRESHOLD:-0}; uv run --locked pytest --cov=embedding_data --cov-report=term-missing --cov-fail-under=$THRESHOLD || exit 1'
        language: system
        pass_filenames: false
        always_run: true
        description: 'Run pytest with coverage and optionally fail if coverage drops below threshold'
