[project]
name = "embedding-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lowell Mason", email = "mason.lowell@mac.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastexcel>=0.21.0",
    "httpx[http2]>=0.28.1",
    "ipumspy>=0.8.2",
    "polars>=2.0.0",
    "python-dotenv>=1.2.4",
    "typer>=0.27.3",
]

[project.scripts]
embedding-data = "embedding_data.cli:app"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "hypothesis>=6.169.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "yapf>=0.43.0",
]

[tool.uv]
package = true
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.ruff]
line-length = 99
indent-width = 4
target-version = 'py314'
extend-exclude = ['*.md', '*.ipynb']

[tool.ruff.lint]
select = ['E', 'F', 'I', 'Q']

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'
docstring-quotes = 'single'

[tool.ruff.lint.isort]
lines-after-imports = 1

[tool.yapf]
based_on_style = 'pep8'
column_limit = 99
blank_lines_around_top_level_definition = 1
blank_line_before_nested_class_or_def = true
join_multiple_lines = false
split_before_dot = true
split_before_logical_operator = true
split_before_arithmetic_operator = true
align_closing_bracket_with_visual_indent = true
dedent_closing_brackets = true
continuation_indent_width = 4
split_before_first_argument = false
split_before_closing_bracket = true
allow_split_before_dict_value = false
coalesce_brackets = false
split_penalty_after_opening_bracket = 10000
split_penalty_for_added_line_split = 10000
split_penalty_excess_character = 10000
allow_multiline_lambdas = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: fetches a live osha.gov page; deselected by default, run with -m network",
]
filterwarnings = ["error::pytest.PytestUnknownMarkWarning"]
