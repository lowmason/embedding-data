[project]
name = "embedding-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lowell Mason", email = "mason.lowell@mac.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipumspy>=0.8.2",
    "polars>=2.0.0",
    "python-dotenv>=1.2.4",
    "typer>=0.27.3",
]

[project.scripts]
embedding-data = "embedding_data.cli:app"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "hypothesis>=6.169.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
